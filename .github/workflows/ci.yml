{
  "name": "Zenith source verification",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {}
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "zenith-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "name": "Ubuntu source verification",
      "runs-on": "ubuntu-latest",
      "timeout-minutes": 20,
      "steps": [
        {
          "name": "Check out reviewed source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "Use the declared Node runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": "package.json",
            "cache": "npm"
          }
        },
        {
          "name": "Install with lifecycle scripts disabled",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Run the local source verification contract",
          "run": "npm run verify"
        },
        {
          "name": "Upload bounded failure artifacts",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "zenith-failure-evidence",
            "path": "test-results/\nplaywright-report/",
            "if-no-files-found": "ignore",
            "include-hidden-files": false,
            "retention-days": 3
          }
        }
      ]
    }
  }
}
