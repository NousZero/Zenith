{
  "name": "Zenith source verification",
  "on": {
    "workflow_dispatch": {},
    "pull_request": {},
    "push": {
      "branches": [
        "main"
      ]
    }
  },
  "permissions": {
    "contents": "read"
  },
  "concurrency": {
    "group": "zenith-ci-${{ github.workflow }}-${{ github.ref }}",
    "cancel-in-progress": true
  },
  "jobs": {
    "verify": {
      "name": "Source verification (${{ matrix.os }})",
      "runs-on": "${{ matrix.os }}",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "os": [
            "ubuntu-latest",
            "macos-latest",
            "windows-latest"
          ]
        }
      },
      "steps": [
        {
          "name": "Check out reviewed source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "Use the declared Node runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": "package.json",
            "cache": "npm"
          }
        },
        {
          "name": "Use the pinned npm version",
          "run": "npm install --global npm@11.17.0 --no-audit --no-fund"
        },
        {
          "name": "Install with lifecycle scripts disabled",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Run the local source verification contract",
          "run": "npm run verify"
        },
        {
          "name": "Upload bounded failure artifacts",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "zenith-failure-evidence-${{ matrix.os }}",
            "path": "test-results/\nplaywright-report/",
            "if-no-files-found": "ignore",
            "include-hidden-files": false,
            "retention-days": 3
          }
        }
      ]
    },
    "e2e": {
      "name": "Desktop end-to-end (macOS)",
      "runs-on": "macos-latest",
      "timeout-minutes": 25,
      "steps": [
        {
          "name": "Check out reviewed source",
          "uses": "actions/checkout@11d5960a326750d5838078e36cf38b85af677262"
        },
        {
          "name": "Use the declared Node runtime",
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version-file": "package.json",
            "cache": "npm"
          }
        },
        {
          "name": "Use the pinned npm version",
          "run": "npm install --global npm@11.17.0 --no-audit --no-fund"
        },
        {
          "name": "Install with lifecycle scripts disabled",
          "run": "npm ci --ignore-scripts --no-audit --no-fund"
        },
        {
          "name": "Download the Electron binary",
          "run": "node node_modules/electron/install.js"
        },
        {
          "name": "Build the app and run the end-to-end suite",
          "run": "npm run test:e2e:build"
        },
        {
          "name": "Upload bounded failure artifacts",
          "if": "failure()",
          "uses": "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02",
          "with": {
            "name": "zenith-e2e-failure-evidence",
            "path": "test-results/\nplaywright-report/",
            "if-no-files-found": "ignore",
            "include-hidden-files": false,
            "retention-days": 3
          }
        }
      ]
    }
  }
}
